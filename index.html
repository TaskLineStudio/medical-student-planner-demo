/* V5 Visual: visual and responsive refinement only */
:root{
  --ink:#18233a;--muted:#64718b;--line:#dfe3f1;--bg:#f4f6fc;--page:#f4f6fc;
  --card:#fff;--surface:#fff;--surface-2:#f7f8fd;--blue:#4f46e5;--blue2:#eef0ff;
  --indigo:#4f46e5;--violet:#7c3aed;--cyan:#0891b2;--rose:#e11d48;
  --emerald:#059669;--amber:#d97706;--slate:#64748b;--red:#e11d48;--green:#059669;
  --chart-teal:#0891b2;--chart-indigo:#4f46e5;--chart-sage:#059669;
  --chart-amber:#d97706;--chart-coral:#e11d48;--nav:#202a44;
  --radius:15px;--shadow:0 1px 2px rgba(38,46,82,.05),0 10px 28px rgba(60,68,120,.07);
}
html{background:var(--page)}
body{background:var(--page);color:var(--ink);min-height:100vh}
.app{align-items:start;min-height:100vh}
.main{margin:0;max-width:none;width:100%;min-height:0;padding:26px clamp(22px,3vw,48px) 48px;align-self:start}
.top{align-items:center;margin:0 0 22px;padding:0 0 18px;border-color:var(--line)}
.top h1{font-size:clamp(25px,2.2vw,32px);letter-spacing:-.025em}
.eyebrow{color:var(--indigo);font-weight:800}
#view{width:100%}
.side{background:#fbfcff;border-color:var(--line);padding:23px 14px 18px;box-shadow:4px 0 24px rgba(55,65,110,.035)}
.brand{color:#1f2a44;letter-spacing:.075em}.brand span{color:var(--indigo)}
.sub{color:#7b849b}.nav-group{color:#939bb0;margin-top:15px}
.nav button{color:#566179;border:1px solid transparent;border-radius:10px;transition:background-color .15s,color .15s}
.nav button:hover{background:#f1f3fb;color:#343f5b}
.nav button.active{background:#eceeff;color:#4338ca;border-color:#dde0ff;font-weight:750}
.nav button.active .nav-icon{color:#5b50e9}.nav-icon{color:#7f8aa2}
.local{border-color:var(--line);color:#8a93a7}
.card,.metric{border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);background:var(--card)}
.card{padding:18px}.card h2{font-size:15px;color:var(--ink);letter-spacing:-.01em}
.card h3{color:var(--muted)}
.metric{padding:13px 14px;position:relative;overflow:hidden}
.metric:before{content:"";position:absolute;width:7px;height:7px;border-radius:50%;right:12px;top:12px;background:var(--slate)}
.metric.urgent:before{background:var(--rose)}.metric.revise:before{background:var(--violet)}
.metric.plan:before{background:var(--cyan)}.metric.next:before{background:var(--indigo)}
.metric,.metric.urgent,.metric.revise,.metric.plan,.metric.next,
.section-tint-teal,.section-tint-indigo,.section-tint-gold,.section-tint-sage{border-top:1px solid var(--line)}
.metric .kicker{color:#778199}.metric strong{font-size:22px}
.decision-strip{gap:10px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#eef0ff 0%,#f7f5ff 100%);border-color:#d9dcff}
.hero h2{color:var(--indigo)}
.btn{border-color:#d5d9e8;background:#fff;color:#35405a;border-radius:9px;padding:7px 11px;font-weight:650}
.btn:hover{background:#f3f4fa}.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn.primary:hover{background:#4338ca}.btn.danger{color:var(--rose);border-color:#f3c5d0}
.link{color:var(--indigo)}.tag{background:#eef1f7;color:#516078}
.tag.high,.high{background:#fff0f3;color:#be123c}.tag.due,.due{background:#fff7e8;color:#b45309}
.progress{height:10px;background:#edf0f8}.progress i{background:linear-gradient(90deg,var(--indigo),var(--violet))}
.warn{background:#fff9ed;border-color:#f4dfb5;color:#7c4a08}
.notice-compact{border-left:3px solid var(--amber);box-shadow:none}
.recommend,.nba-box{background:#f3f1ff;border-color:#d9d4ff;border-left:4px solid var(--violet)}
.exam-title{background:linear-gradient(135deg,#3730a3,#5b21b6);border-color:#6157c7;box-shadow:0 15px 34px rgba(79,70,229,.2)}
.exam-title .meta{color:#dddafe}.exam-head>.metric:first-of-type:before{background:var(--rose)}
.ring{width:82px;height:82px;background:conic-gradient(var(--ring,var(--violet)) calc(var(--p)*1%),#e9eaf4 0)}
.ring:before{width:58px;height:58px}.ring span{font-size:13px}
.goal-visual{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:16px 0}
.goal-visual+.goal-visual{border-top:1px solid var(--line)}
.goal-title{font-size:15px;line-height:1.35}.goal-details{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.goal-reflection{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border-left:3px solid var(--violet)}
.goal-card-head{margin-bottom:2px}.goals-grid{align-items:start}
.chart-card{min-height:310px;padding:18px;display:flex;flex-direction:column}
.chart-card .chart-svg{height:220px;min-height:220px;margin-top:auto}
.chart-card .donut-layout{min-height:220px;flex:1}.chart-card .donut{width:154px;height:154px}
.chart-card .donut:after{inset:28px}.chart-card .donut-center{font-size:20px}
.chart-card .legend{font-size:12px;gap:9px}.chart-card .status-stack{height:28px}
.dashboard-chart-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dashboard-kpis{gap:10px;margin-bottom:14px}
.dashboard-kpis .metric{padding:12px}.dashboard-kpis .metric strong{font-size:20px}
.chart-sub{font-size:11px;margin-bottom:12px}
.chart-svg text{font-size:10px}.chart-svg .bar{fill:var(--indigo)}
.chart-svg .line{stroke:var(--indigo);stroke-width:3}.chart-svg .area{fill:color-mix(in srgb,var(--violet) 18%,transparent)}
.analytics-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.8fr);gap:14px}
.analytics-card{min-height:300px}.analytics-card .chart-svg{height:230px}
.distribution-card .chart-row{margin:13px 0}.distribution-card .bar-track{height:12px}
.chart-row>span:first-child{width:145px}.bar-track{height:10px;background:#eceef7}
.bar-fill{background:var(--cyan)}.bar-fill.indigo{background:var(--violet)}
.bar-fill.gold{background:var(--amber)}.bar-fill.coral{background:var(--rose)}
.heat{height:180px;gap:6px;align-items:end;padding-top:10px}
.heat i{min-width:9px;background:#d6f3f8;border-radius:6px 6px 2px 2px}.heat i.hot{background:var(--cyan)}.heat i.warn{background:var(--amber)}
.study-entry-grid{grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);align-items:start}
.study-entry-grid>.card{height:auto;min-height:0}
.item{padding:12px 0}.item strong{line-height:1.35}.meta{color:var(--muted)}
.matrix{border-color:var(--line);border-radius:11px;overflow:hidden;background:var(--card)}
.matrix>*{padding:10px;border-color:var(--line)}.matrix .mh{background:#f4f5fb;color:#677189}
.matrix .needs{background:#fff0f3;color:#be123c}.matrix .good{background:#eafaf4;color:#047857}
.revision-summary-grid>.card{min-height:230px}.revision-topic-list>.item{padding:14px 4px}
.calendar-toolbar,.timetable-controls{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 12px;box-shadow:var(--shadow)}
.month-grid,.month-cell,.agenda-day,.timetable-grid{border-color:var(--line)}
.month-cell{min-height:116px}.month-cell:hover,.month-cell.selected{box-shadow:inset 0 0 0 2px var(--indigo)}
.month-cell.today-cell .date-num,.segmented button.active{background:var(--indigo);color:#fff}
.cell-load i.on{background:var(--rose)}.cal-chip.exam{background:#fff0f3;color:#a81237;border-color:var(--rose)}
.cal-chip.deadline{background:#fff6e7;color:#99520a;border-color:var(--amber)}
.cal-chip.study-block{background:#eef0ff;color:#4037a7;border-color:var(--indigo)}
.cal-chip.teaching{background:#eaf8fb;color:#0e6c82;border-color:var(--cyan)}
.cal-chip.placement{background:#f5efff;color:#6d28d9;border-color:var(--violet)}
.saved{padding:5px 9px;border-radius:999px;background:#f0fdf7;color:#047857}
.saved:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--emerald);margin-right:6px;vertical-align:1px}
.next-task-control{max-width:300px;white-space:normal;text-align:left;line-height:1.25}
.theme-toggle{width:38px;height:34px;justify-content:center;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline-color:#818cf8}

html[data-theme="dark"]{
  --ink:#f0f2f8;--muted:#a8afc0;--line:#3a4051;--bg:#171a22;--page:#171a22;
  --card:#232732;--surface:#1e222c;--surface-2:#2b303c;--blue:#818cf8;--blue2:#30344c;
  --indigo:#818cf8;--violet:#a78bfa;--cyan:#22d3ee;--rose:#fb7185;--emerald:#34d399;
  --amber:#fbbf24;--slate:#9aa3b8;--red:#fb7185;--green:#34d399;
  --chart-teal:#22d3ee;--chart-indigo:#818cf8;--chart-sage:#34d399;
  --chart-amber:#fbbf24;--chart-coral:#fb7185;--nav:#f0f2f8;
  --shadow:0 1px 1px rgba(0,0,0,.25),0 14px 32px rgba(0,0,0,.18);
  color-scheme:dark;
}
html[data-theme="dark"] body,html[data-theme="dark"] .app{background:#171a22;color:var(--ink)}
html[data-theme="dark"] .side{background:#1d2029;border-color:#353a49}
html[data-theme="dark"] .brand{color:#f3f4f8}
html[data-theme="dark"] .nav button{color:#aeb5c6}

.theme-toggle{

  align-items:center;justify-content:center;gap:7px;line-height:1;overflow:hidden;

}

.theme-toggle:hover,.theme-toggle:focus-visible{width:auto;min-width:78px;height:34px;padding:0 11px}
.appearance-section{display:grid;gap:18px}
.appearance-group{display:grid;gap:8px}
.appearance-group>.row{align-items:end}
.palette-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.palette-option{
  display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:10px;
  text-align:left;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);
  color:var(--ink);padding:10px;min-width:0
}

.palette-option.selected{border-color:var(--indigo);box-shadow:0 0 0 2px color-mix(in srgb,var(--indigo) 18%,transparent)}
.palette-option strong{font-size:12px}.palette-option .meta{font-size:10px}
.palette-check{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--indigo);color:white;font-size:11px;opacity:0}
.palette-option.selected .palette-check{opacity:1}
.palette-swatches{display:grid;grid-template-columns:repeat(4,1fr);height:28px;border-radius:7px;overflow:hidden;border:1px solid color-mix(in srgb,var(--line) 80%,transparent)}
.palette-swatches i{display:block}

/* V6A: enlarged dashboard donut and restrained data-visualisation motion */
@property --draw{syntax:"<number>";inherits:false;initial-value:0}
.chart-card .donut-layout{min-height:250px;gap:22px;align-items:center}
.chart-card .donut{
  width:236px;height:236px;flex:0 0 236px;background:var(--surface-2)!important;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent)
}
.chart-card .donut:after{display:none}
.donut-fill{
  position:absolute;inset:0;border-radius:50%;
  -webkit-mask:radial-gradient(circle,transparent 0 58%,#000 59%),conic-gradient(#000 calc(var(--draw)*1%),transparent 0);
  -webkit-mask-composite:source-in;
  mask:radial-gradient(circle,transparent 0 58%,#000 59%),conic-gradient(#000 calc(var(--draw)*1%),transparent 0);
  mask-composite:intersect;
  animation:donutDraw 520ms cubic-bezier(.2,.75,.25,1) both
}
.chart-card .donut-center{font-size:30px;line-height:1;letter-spacing:-.03em}
.chart-card .donut-center small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:7px}
.chart-card .legend{font-size:12px;gap:10px;min-width:105px}
.chart-card .legend i{width:10px;height:10px;border-radius:3px}
@keyframes donutDraw{from{--draw:0}to{--draw:100}}

.ring{
  --draw:0;
  background:conic-gradient(var(--ring,var(--violet)) calc(var(--draw)*1%),color-mix(in srgb,var(--line) 72%,var(--surface-2)) 0)!important;
  animation:ringDraw 480ms cubic-bezier(.2,.75,.25,1) both
}
@keyframes ringDraw{from{--draw:0}to{--draw:var(--p)}}
.bar-fill{transform-origin:left center;animation:barGrowX 430ms cubic-bezier(.2,.75,.25,1) both}
.chart-svg .bar{transform-box:fill-box;transform-origin:center bottom;animation:barGrowY 460ms cubic-bezier(.2,.75,.25,1) both}
@keyframes barGrowX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes barGrowY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.chart-svg .line,.chart-svg .area,.chart-svg circle{animation:chartReveal 520ms cubic-bezier(.2,.75,.25,1) both}
.chart-svg .area{animation-duration:480ms}.chart-svg circle{animation-delay:120ms}
@keyframes chartReveal{from{clip-path:inset(0 100% 0 0);opacity:.25}to{clip-path:inset(0 0 0 0);opacity:1}}
.heat i{transform-origin:center bottom;animation:heatRise 420ms cubic-bezier(.2,.75,.25,1) both}
.heat i:nth-child(2n){animation-delay:35ms}.heat i:nth-child(3n){animation-delay:70ms}
@keyframes heatRise{from{transform:scaleY(.18);opacity:.2}to{transform:scaleY(1);opacity:1}}
.heatmap i{animation:heatFade 360ms ease-out both}
.heatmap i:nth-child(4n+2){animation-delay:30ms}.heatmap i:nth-child(4n+3){animation-delay:60ms}.heatmap i:nth-child(4n){animation-delay:90ms}
@keyframes heatFade{from{opacity:.18}to{opacity:1}}
.metric strong,.stat{animation:valueSettle 360ms cubic-bezier(.2,.75,.25,1) both}
@keyframes valueSettle{from{opacity:.55;transform:translateY(3px)}to{opacity:1;transform:none}}

body,.side,.card,.metric,.modalbox,.btn,.nav button,.mobile-nav,
.field input,.field select,.field textarea,.palette-option,.segmented button{
  transition:background-color 170ms ease-out,color 170ms ease-out,border-color 170ms ease-out,box-shadow 170ms ease-out
}
.btn,.nav button,.palette-option,.segmented button{transition-duration:150ms}
.modal:not(.hidden) .modalbox{animation:modalIn 180ms ease-out both}
@keyframes modalIn{from{opacity:.4;transform:translateY(7px) scale(.992)}to{opacity:1;transform:none}}
html[data-motion="static"] .donut-fill,html[data-motion="static"] .ring,
html[data-motion="static"] .bar-fill,html[data-motion="static"] .chart-svg .bar,
html[data-motion="static"] .chart-svg .line,html[data-motion="static"] .chart-svg .area,

/* V7 Responsive: tablet/mobile repair with desktop design preserved */
@property --seg{syntax:"<number>";inherits:false;initial-value:0}
html,body{max-width:100%;overflow-x:clip}
.main,#view,.card,.metric,.grid>*{min-width:0}
.btn,.mobile-nav button,.more-menu button,.day-selector button,.segmented button{touch-action:manipulation}

.donut-track{stroke-width:14}.donut-segment{fill:none;stroke-width:14;stroke-linecap:round;--seg:0;stroke-dasharray:calc(var(--seg)*1) calc(100 - var(--seg));animation:segmentDraw 520ms cubic-bezier(.2,.75,.25,1) both}

const PALETTES={
  'studio-blue':{name:'Studio Blue',note:'Clean and focused',className:'palette-studio'},
  'ink-violet':{name:'Ink Violet',note:'Academic and distinctive',className:'palette-violet'},
  'editorial-stone':{name:'Editorial Stone',note:'Warm and refined',className:'palette-stone'},

function normalizeAppearanceSettings(settings={}){
  settings.theme=settings.theme==='dark'?'dark':'light';
  settings.palette=PALETTES[settings.palette]?settings.palette:'studio-blue';
  settings.weekStart=settings.weekStart||(settings.weekMonday===false?'Sunday':'Monday');
  if(!['Monday','Sunday'].includes(settings.weekStart))settings.weekStart='Monday';
  settings.weekMonday=settings.weekStart==='Monday';
  return settings
}

function applyTheme(){

  document.documentElement.dataset.theme=state.settings.theme;
  document.documentElement.dataset.palette=state.settings.palette;

function monotonePath(points){

}

  <section class="card osce-card osce-next osce-next-prominent"><div class="row"><h2>Next Best Practice</h2><button class="link" onclick="go('osce')">Refresh view</button></div>${next?`<div class="osce-next-station"><div><h3>${esc(next.name)}</h3><div class="meta">${esc(next.category)} · ${esc(next.priority)} priority · ${esc(osceDueText(next.nextPractice))}</div></div><div>${osceScore(next.confidence)}</div><button class="btn primary" onclick="openLogOsceAttempt('${next.id}')">Log Practice</button><div class="osce-reason"><b>Why this?</b><div class="meta">${osceReason(next)}</div></div></div>`:empty('Add an active station to receive a transparent recommendation.')}</section>
  <div class="osce-analytics"><section class="card osce-card"><div class="row"><h2>Confidence by Category</h2><span class="meta">1 = Low · 5 = High</span></div>${OSCE_CATEGORIES.map(category=>`<div class="osce-confidence-row"><span>${esc(category)}</span><div class="osce-confidence-track"><div class="osce-confidence-fill" style="width:${categories[category]/5*100}%"></div></div><b>${categories[category]?categories[category].toFixed(1):'—'}</b></div>`).join('')}</section><section class="card osce-card osce-practice-chart"><h2>Practice Activity</h2><div class="chart-sub">Attempts over the past seven days</div>${svgBars(activity,activityDates.map(date=>d(date).toLocaleDateString(undefined,{weekday:'short'})),'OSCE practice attempts over seven days')}</section></div>
  <section class="card osce-card osce-queue"><div class="row"><h2>Practice Queue</h2><span class="meta">${queue.length} prioritised</span></div>${queue.length?queue.map(station=>`<button class="osce-queue-row osce-queue-button" onclick="viewOsceStation('${station.id}')"><strong>${esc(station.name)}</strong><span class="meta">${esc(station.category)}</span><span>${esc(osceDueText(station.nextPractice))}</span>${osceScore(station.confidence)}</button>`).join(''):empty('Add an active station to build your practice queue.')}</section>
  <section class="card osce-card osce-tracker"><div class="row osce-tracker-head"><div><span class="source-label">All stations</span><h2>Station Tracker</h2></div><div class="actions"><b>${filtered.length} shown</b><button class="btn primary" onclick="openOsceStation()">${osceUxIcon()}Add Station</button></div></div>${state.osceStations.length?`<div class="osce-filters"><label class="field">Search<input value="${esc(osceSearch)}" placeholder="Search stations" oninput="osceSearch=this.value;render()"></label><label class="field">Category<select onchange="osceCategory=this.value;render()">${options(['All',...OSCE_CATEGORIES],osceCategory)}</select></label><label class="field">Confidence<select onchange="osceConfidence=this.value;render()">${options(['All','1','2','3','4','5'],osceConfidence)}</select></label><label class="field">Due status<select onchange="osceDue=this.value;render()">${options(['All','Overdue','Due today','Needs attention','Upcoming','Confident','Archived'],osceDue)}</select></label><label class="field">Priority<select onchange="oscePriorityFilter=this.value;render()">${options(['All',...OSCE_PRIORITIES],oscePriorityFilter)}</select></label><label class="field">Archive<select onchange="osceArchiveFilter=this.value;render()">${options(['Active','Archived','All'],osceArchiveFilter)}</select></label><button class="btn" onclick="resetOsceFilters()">Clear Filters</button></div>`:''}${tracker}</section>
  <section class="card osce-card osce-feedback"><div class="row"><div><h2>Recent Feedback Focus</h2><div class="meta">Counts use selected improvement tags only</div></div></div><div class="osce-feedback-grid">${focusList.length?focusList.map(([focus,count],index)=>`<div class="osce-feedback-item"><span class="osce-feedback-icon">${index+1}</span><div><strong>${esc(focus)}</strong><div class="meta">Selected in ${count} attempt${count===1?'':'s'}</div></div><b>${count}</b></div>`).join(''):empty('Feedback themes will appear after practice attempts.')}</div></section>`
}
var osceUxValidateBase=validateBackupEnvelope;
validateBackupEnvelope=function(envelope){
  let candidate=osceUxValidateBase(envelope);normalizeOsceUxData(candidate);
  candidate.osceStations.forEach(station=>{if(typeof station.linkedExam!=='string'||!Number.isFinite(Number(station.targetDuration))||Number(station.targetDuration)<1||Number(station.targetDuration)>120||typeof station.checklist!=='string')throw Error('An OSCE station usability field is invalid.')});
  candidate.osceAttempts.forEach(attempt=>OSCE_UX_DOMAINS.forEach(domain=>{let value=attempt.domainRatings?.[domain];if(value!==''&&(!Number.isFinite(Number(value))||Number(value)<1||Number(value)>5))throw Error('An OSCE domain rating is invalid.')}));
  return candidate
};


const DEMO_NOTICE='Read-only demonstration — changes are disabled · fictional sample data';
const READ_ONLY_MUTATIONS=['addCourse','editCourse','submitCourse','addTask','editTask','submitTask','toggleTask','priority','addEvent','addEventFor','editEvent','submitEvent','addTimetable','editTimetable','submitTimetable','addRevision','editRevision','submitRevision','openLogRevision','logReview','submitRevisionLog','editRevisionHistory','deleteRevisionHistory','addSession','editSession','saveSession','addGoal','editGoal','submitGoal','del','resetData','exportData','importData','restorePendingBackup','openClearPlannerData','clearPlannerData','openOsceStation','submitOsceStation','openLogOsceAttempt','submitOsceAttempt','deleteOsceAttempt','toggleOsceArchive','deleteOsceStation','openOsceExamDate','submitOsceExamDate','submitOsceNotes'];
save=function(){setSaveStatus('Demo resets on refresh');return true};
backupReminder=function(){return''};
shouldRemindBackup=function(){return false};
function readOnlyBlocked(){showDemoNotice();return false}
function showDemoNotice(){let notice=document.getElementById('demoToast');if(notice)notice.remove();notice=document.createElement('div');notice.id='demoToast';notice.className='notice-toast';notice.setAttribute?.('role','status');notice.textContent=DEMO_NOTICE;document.body?.appendChild?.(notice);setTimeout(()=>notice.remove?.(),2600)}
function applyReadOnlyUI(){
  let pattern=new RegExp('\\b('+READ_ONLY_MUTATIONS.join('|')+')\\b');
  if(document.querySelectorAll)document.querySelectorAll('button,label.btn,form').forEach(element=>{let code=[element.getAttribute?.('onclick'),element.getAttribute?.('onsubmit'),element.getAttribute?.('onchange')].filter(Boolean).join(' ');if(pattern.test(code)){if(element.tagName==='FORM'){let section=element.closest?.('section');(section||element).remove()}else element.remove()}});
  document.querySelectorAll?.('details.osce-more').forEach(menu=>{if(!menu.querySelector?.('button'))menu.remove()});
  document.querySelectorAll?.('.osce-mobile-actions,.osce-toolbar .actions,.osce-tracker-head .actions').forEach(group=>{if(!group.querySelector?.('button'))group.remove()});
  let saved=document.getElementById('saved');if(saved){saved.textContent='Demo resets on refresh';saved.classList?.remove('save-state-failed')}
}
var demoReadOnlyModalBase=modal;
modal=function(title,body){demoReadOnlyModalBase(title,body);applyReadOnlyUI()};
osceNotesTab=function(station){return '<div class="grid two osce-notes-preview"><section><h3>Personal checklist</h3><p class="osce-note">'+(station.checklist?esc(station.checklist):'No checklist added.')+'</p></section><section><h3>General station notes</h3><p class="osce-note">'+(station.notes?esc(station.notes):'No notes added.')+'</p></section></div>'};
settings=function(){
  let counts=recordCounts(),palette=PALETTES[state.settings.palette]||PALETTES['studio-blue'];
  return decisionStrip([metric('Fictional records',counts.total,'eight-week demonstration','revise'),metric('Storage','None','resets on refresh','urgent'),metric('Appearance',palette.name,state.settings.theme==='dark'?'Dark mode':'Light mode','plan'),metric('Editing','Disabled','exploration only','next')])+
  '<div class="grid two settings-layout"><section class="card appearance-section"><div class="appearance-group"><div><span class="source-label">Appearance preview</span><h2>Mode</h2></div><div class="segmented"><button class="'+(state.settings.theme==='light'?'active':'')+'" onclick="setAppearanceMode(\'light\')">Light</button><button class="'+(state.settings.theme==='dark'?'active':'')+'" onclick="setAppearanceMode(\'dark\')">Dark</button></div></div><div class="appearance-group"><div><h2>Palette</h2><span class="meta">Preview every included colour system.</span></div><div class="palette-grid">'+Object.keys(PALETTES).map(paletteOption).join('')+'</div></div><button class="btn" onclick="resetAppearance()">Reset appearance preview</button></section><section class="grid"><div class="card"><h2>Calendar preview</h2><div class="appearance-group"><span class="field">Week starts</span><div class="segmented week-start-control"><button class="'+(state.settings.weekStart==='Monday'?'active':'')+'" onclick="setWeekStart(\'Monday\')">Monday</button><button class="'+(state.settings.weekStart==='Sunday'?'active':'')+'" onclick="setWeekStart(\'Sunday\')">Sunday</button></div></div><p class="meta">Theme, palette and week-start previews reset with the page.</p></div><div class="card demo-information"><h2>Read-only demonstration</h2><p><b>Changes to records are disabled.</b></p><p class="meta">Explore navigation, calendars, filters, charts, station details and practice history. All records are fictional and contain no patient-identifiable information.</p></div></section></div>'
};
var demoReadOnlyRenderBase=render;
render=function(){demoReadOnlyRenderBase();let view=document.getElementById('view');if(view&&!document.getElementById('demoNotice'))view.insertAdjacentHTML?.('afterbegin','<div class="demo-notice" id="demoNotice" role="status">'+DEMO_NOTICE+'</div>');applyReadOnlyUI()};
for(const name of READ_ONLY_MUTATIONS)globalThis[name]=readOnlyBlocked;
document.documentElement.dataset.demoReadonly='true';

render();
</script></body></html>
